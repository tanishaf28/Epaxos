<svg width="100%" viewBox="0 0 680 1280">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Phase 1: Client Submission -->
<g class="c-blue">
<rect x="40" y="40" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="64" text-anchor="middle" dominant-baseline="central">Client submits command</text>
<text class="ts" x="180" y="86" text-anchor="middle" dominant-baseline="central">Batch of operations with object IDs</text>
</g>

<line x1="180" y1="110" x2="180" y2="150" class="arr" marker-end="url(#arrow)"/>

<!-- Phase 2: Leader Selection -->
<g class="c-purple">
<rect x="40" y="150" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="174" text-anchor="middle" dominant-baseline="central">Leader assigns instance ID</text>
<text class="ts" x="180" y="196" text-anchor="middle" dominant-baseline="central">R2.55 = Replica 2, Instance 55</text>
</g>

<line x1="180" y1="220" x2="180" y2="260" class="arr" marker-end="url(#arrow)"/>

<!-- Phase 3: Dependency Detection -->
<g class="c-teal">
<rect x="40" y="260" width="280" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="284" text-anchor="middle" dominant-baseline="central">Detect interfering instances</text>
<text class="ts" x="180" y="306" text-anchor="middle" dominant-baseline="central">Read conflicts table before</text>
<text class="ts" x="180" y="324" text-anchor="middle" dominant-baseline="central">registering self</text>
</g>

<line x1="180" y1="344" x2="180" y2="384" class="arr" marker-end="url(#arrow)"/>

<!-- Fast Path Decision Point -->
<g class="c-amber">
<rect x="40" y="384" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="180" y="408" text-anchor="middle" dominant-baseline="central">PreAccept phase</text>
<text class="ts" x="180" y="430" text-anchor="middle" dominant-baseline="central">Broadcast to all replicas</text>
</g>

<!-- Fork to Fast and Slow Paths -->
<line x1="180" y1="454" x2="180" y2="490" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="490" x2="100" y2="530" class="arr" marker-end="url(#arrow)"/>
<line x1="180" y1="490" x2="500" y2="530" class="arr" marker-end="url(#arrow)"/>

<!-- Fast Path (Left) -->
<g class="c-green">
<rect x="40" y="530" width="280" height="160" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="558" text-anchor="middle" dominant-baseline="central">Fast path</text>

<rect x="60" y="576" width="240" height="44" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="598" text-anchor="middle" dominant-baseline="central">All replicas agree on seq and deps</text>

<rect x="60" y="632" width="240" height="44" rx="6" stroke-width="0.5"/>
<text class="ts" x="180" y="654" text-anchor="middle" dominant-baseline="central">Fast quorum reached (N/2 + 1)</text>
</g>

<!-- Slow Path (Right) -->
<g class="c-coral">
<rect x="360" y="530" width="280" height="230" rx="12" stroke-width="0.5"/>
<text class="th" x="500" y="558" text-anchor="middle" dominant-baseline="central">Slow path</text>

<rect x="380" y="576" width="240" height="44" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="598" text-anchor="middle" dominant-baseline="central">Conflicting seq or deps detected</text>

<rect x="380" y="632" width="240" height="56" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="652" text-anchor="middle" dominant-baseline="central">Leader merges responses</text>
<text class="ts" x="500" y="670" text-anchor="middle" dominant-baseline="central">and computes union</text>

<rect x="380" y="700" width="240" height="44" rx="6" stroke-width="0.5"/>
<text class="ts" x="500" y="722" text-anchor="middle" dominant-baseline="central">Accept phase to N/2 replicas</text>
</g>

<!-- Convergence to Commit -->
<line x1="180" y1="690" x2="180" y2="800" class="arr" marker-end="url(#arrow)"/>
<line x1="500" y1="760" x2="500" y2="800" class="arr" marker-end="url(#arrow)"/>
<path d="M180 800 L340 840" class="arr" marker-end="url(#arrow)" fill="none"/>
<path d="M500 800 L340 840" class="arr" marker-end="url(#arrow)" fill="none"/>

<!-- Commit Phase -->
<g class="c-pink">
<rect x="200" y="840" width="280" height="84" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="864" text-anchor="middle" dominant-baseline="central">Commit phase</text>
<text class="ts" x="340" y="886" text-anchor="middle" dominant-baseline="central">Broadcast commit message</text>
<text class="ts" x="340" y="904" text-anchor="middle" dominant-baseline="central">Instance marked COMMITTED</text>
</g>

<line x1="340" y1="924" x2="340" y2="970" class="arr" marker-end="url(#arrow)"/>

<!-- Execution Phase -->
<g class="c-purple">
<rect x="200" y="970" width="280" height="112" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="994" text-anchor="middle" dominant-baseline="central">Asynchronous execution</text>
<text class="ts" x="340" y="1016" text-anchor="middle" dominant-baseline="central">Build dependency graph (SCC)</text>
<text class="ts" x="340" y="1034" text-anchor="middle" dominant-baseline="central">Topological sort by seq</text>
<text class="ts" x="340" y="1052" text-anchor="middle" dominant-baseline="central">Execute in dependency order</text>
</g>

<line x1="340" y1="1082" x2="340" y2="1130" class="arr" marker-end="url(#arrow)"/>

<!-- Client Reply -->
<g class="c-blue">
<rect x="200" y="1130" width="280" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="1154" text-anchor="middle" dominant-baseline="central">Reply to client</text>
<text class="ts" x="340" y="1176" text-anchor="middle" dominant-baseline="central">Success, path used, latency</text>
</g>

<!-- Key Properties (Right Side) -->
<g class="node" onclick="sendPrompt('Explain EPaxos interference detection')">
<text class="th" x="520" y="80" text-anchor="start">Key properties</text>
<text class="ts" x="520" y="102" text-anchor="start">• No single leader</text>
<text class="ts" x="520" y="120" text-anchor="start">• Egalitarian commit</text>
<text class="ts" x="520" y="138" text-anchor="start">• Dependency tracking</text>
<text class="ts" x="520" y="156" text-anchor="start">• Fast path: 1 RTT</text>
<text class="ts" x="520" y="174" text-anchor="start">• Slow path: 2 RTT</text>
</g>

<!-- Instance State -->
<g class="node" onclick="sendPrompt('What are the EPaxos instance states?')">
<text class="th" x="520" y="250" text-anchor="start">Instance states</text>
<text class="ts" x="520" y="272" text-anchor="start">PREACCEPTED</text>
<text class="ts" x="520" y="290" text-anchor="start">ACCEPTED</text>
<text class="ts" x="520" y="308" text-anchor="start">COMMITTED</text>
<text class="ts" x="520" y="326" text-anchor="start">EXECUTED</text>
</g>

<!-- Critical Ordering -->
<g class="node" onclick="sendPrompt('Why must EPaxos read deps before registering?')">
<rect x="360" y="260" width="280" height="84" rx="8" stroke-width="0.5" class="c-red"/>
<text class="th" x="500" y="284" text-anchor="middle" dominant-baseline="central">Critical ordering</text>
<text class="ts" x="500" y="306" text-anchor="middle" dominant-baseline="central">Must read conflicts table</text>
<text class="ts" x="500" y="324" text-anchor="middle" dominant-baseline="central">BEFORE registering self</text>
</g>

</svg>